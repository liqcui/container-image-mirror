apiVersion: mirror.suanova.io/v1alpha1
kind: RegistryList
metadata:
  name: default

spec:
  # Credentials are never stored in this repository. They are supplied at
  # runtime through the MIRROR_CREDENTIALS_JSON environment variable, shaped as:
  #
  #   {
  #     "harbor.isuanova.com": {"username": "robot$mirrors+pusher", "password": "..."},
  #     "quay.io":             {"username": "...", "password": "..."}
  #   }
  #
  # Hosts declared with `auth: credentials` must have an entry there; SKOPEO
  # reads the matching entry from the single authfile generated by the scripts.
  destinations:
    - host: harbor.isuanova.com
      project: mirrors
      auth: credentials
      tlsVerify: true

  sources:
    - host: docker.io
      auth: anonymous
      tlsVerify: true
    - host: quay.io
      auth: anonymous
      tlsVerify: true
    - host: ghcr.io
      auth: anonymous
      tlsVerify: true
    - host: registry.k8s.io
      auth: anonymous
      tlsVerify: true
    - host: nvcr.io
      auth: anonymous
      tlsVerify: true
