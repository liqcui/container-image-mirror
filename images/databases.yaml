apiVersion: mirror.suanova.io/v1alpha1
kind: ImageMirrorList
metadata:
  name: databases
  description: Data stores running inside the platform.

spec:
  defaults:
    platforms:
      - linux/amd64
      - linux/arm64

  images:
    - name: postgres
      source: docker.io/library/postgres
      target: harbor.isuanova.com/mirrors/docker.io/library/postgres
      versions:
        # Major 17 is kept for existing clusters while 18 is rolled out.
        - tag: "17.6"
        - tag: "18.0"

    - name: redis
      source: docker.io/library/redis
      target: harbor.isuanova.com/mirrors/docker.io/library/redis
      versions:
        - tag: "8.10.3"
