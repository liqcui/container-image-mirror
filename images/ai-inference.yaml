apiVersion: mirror.suanova.io/v1alpha1
kind: ImageMirrorList
metadata:
  name: ai-inference
  description: Model serving runtimes used by the inference platform.

spec:
  defaults:
    platforms:
      - linux/amd64
      - linux/arm64

  images:
    - name: ollama
      source: docker.io/ollama/ollama
      target: harbor.isuanova.com/mirrors/docker.io/ollama/ollama
      versions:
        - tag: "0.40.13"

    - name: vllm-openai
      source: docker.io/vllm/vllm-openai
      target: harbor.isuanova.com/mirrors/docker.io/vllm/vllm-openai
      versions:
        - tag: v0.11.0
