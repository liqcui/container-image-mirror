apiVersion: mirror.suanova.io/v1alpha1
kind: ImageMirrorList
metadata:
  name: networking
  description: Ingress controllers, proxies and web servers.

spec:
  defaults:
    platforms:
      - linux/amd64
      - linux/arm64

  images:
    - name: nginx
      source: docker.io/library/nginx
      target: harbor.isuanova.com/mirrors/docker.io/library/nginx
      versions:
        - tag: "1.31.8"

    - name: traefik
      source: docker.io/library/traefik
      target: harbor.isuanova.com/mirrors/docker.io/library/traefik
      versions:
        - tag: v3.5.0

    - name: envoy
      source: docker.io/envoyproxy/envoy
      target: harbor.isuanova.com/mirrors/docker.io/envoyproxy/envoy
      versions:
        - tag: v1.35.0
