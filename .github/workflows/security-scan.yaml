name: Security scan

# Weekly vulnerability scan and SBOM generation for everything that has been
# mirrored. Scans run against the digest currently stored in Harbor, so the
# report always describes the bytes production actually pulls.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    env:
      MIRROR_CREDENTIALS_JSON: ${{ secrets.MIRROR_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.76.1
          trivy --version

      - name: Scan mirrored images
        run: ./scripts/scan.sh --all

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .results/scan
          if-no-files-found: warn
          retention-days: 90
