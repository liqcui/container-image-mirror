name: Scheduled sync

# Pinned manifests do not follow upstream releases, so this job never invents a
# new version. It re-asserts the pinned state: each target must still hold the
# bytes described by the manifest. Missing targets are copied, changed upstream
# tags are reported as drift and left untouched.

on:
  schedule:
    # Weekly, Monday 03:17 UTC, ahead of the weekly security scan. Deliberately
    # off the hour: every scheduled job on GitHub asks for :00.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      MIRROR_CREDENTIALS_JSON: ${{ secrets.MIRROR_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Check credentials
        run: |
          if [[ -z "${MIRROR_CREDENTIALS_JSON:-}" ]]; then
            echo "::error::MIRROR_CREDENTIALS_JSON is not configured (see docs/security.md)"
            exit 1
          fi

      - name: Re-assert pinned images
        run: ./scripts/sync.sh

      - name: Generate report
        if: always()
        run: ./scripts/generate-report.sh
